ShortDescription: The agent desk for Windows. Grok plans up to 12 steps. Clip clicks only after you stamp. Halt anytime.
Description: FR!sky Paperclip Desk is the agent desk as a native Windows app. Pick your mind, type a task, and it plans and acts in up to 12 steps. HANDS actions only run while you press STAMP; HALT stops everything instantly. Bring your own API key, stored on your machine. No telemetry, no accounts.
ReleaseNotes: First native Windows release of the 0.4.0 desk. Windowed app with STAMP/HALT controls, Ctrl+Shift+P summon. In-app hotkeys only; no tray or global hotkey in v1.
