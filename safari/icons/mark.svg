<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="FR!sky Paperclip mark">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbf8"/>
      <stop offset="0.55" stop-color="#9aabad"/>
      <stop offset="1" stop-color="#536769"/>
    </linearGradient>
    <linearGradient id="stamp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b7a"/>
      <stop offset="0.5" stop-color="#ff334e"/>
      <stop offset="1" stop-color="#ff334e"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="#07010f"/>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none" stroke="#9cebdc26" stroke-width="2"/>
  <!-- paperclip: one continuous loop -->
  <path d="M66 22 v60 c0 15 -11 24 -24 24 c-14 0 -24 -10 -24 -23 V48 c0 -12 9 -20 20 -20 c10 0 17 7 17 17 v38"
        fill="none" stroke="url(#metal)" stroke-width="10" stroke-linecap="round"/>
  <!-- the red STAMP bar striking through -->
  <rect x="24" y="56" width="80" height="18" rx="9" fill="url(#stamp)"/>
</svg>
