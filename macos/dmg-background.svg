<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440">
  <!-- DMG background for "FR!sky Paperclip" (doctrine dark).
       Rendered at 2x (1320x880) by macos/package-dmg.sh via rsvg-convert.
       Fonts: system only (Arial Black / Courier) — rsvg-safe.
       %%VERSION%% is substituted with the app version at packaging time. -->
  <rect width="660" height="440" fill="#030708"/>

  <!-- watermark mark, drawn inline (<image> does not resolve in rsvg) -->
  <g transform="translate(330,222) scale(2.5) translate(-64,-64)" opacity="0.08">
    <rect x="6" y="6" width="116" height="116" rx="26" fill="#0d1517" stroke="#9cebdc" stroke-width="2"/>
    <path d="M66 22 v60 c0 15 -11 24 -24 24 c-14 0 -24 -10 -24 -23 V48 c0 -12 9 -20 20 -20 c10 0 17 7 17 17 v38"
          fill="none" stroke="#9aabad" stroke-width="10" stroke-linecap="round"/>
    <rect x="24" y="56" width="80" height="18" rx="9" fill="none" stroke="#9aabad" stroke-width="8"/>
  </g>

  <!-- headline -->
  <text x="330" y="118" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="92"
        fill="none" stroke="#ff334e" stroke-width="2" paint-order="stroke">CLIP IN.</text>

  <!-- red -> gold -> mint rules -->
  <rect x="180" y="138" width="300" height="4" fill="#ff334e"/>
  <rect x="180" y="147" width="300" height="4" fill="#f1b75c"/>
  <rect x="180" y="156" width="300" height="4" fill="#22c7a8"/>

  <!-- install hint -->
  <text x="330" y="368" text-anchor="middle"
        font-family="Courier, Courier New, monospace" font-size="21" letter-spacing="5"
        fill="#9cebdc">DRAG TO APPLICATIONS</text>
  <text x="330" y="396" text-anchor="middle"
        font-family="Courier, Courier New, monospace" font-size="14" letter-spacing="3"
        fill="#536769">FR!SKY PAPERCLIP DESK &#183; v%%VERSION%%</text>
</svg>
